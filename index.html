<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Srishti &amp; Shubham</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#5c0f1f" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital@1&family=Great+Vibes&family=Marcellus&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet" />
  <style>
    /* The bare domain (and any unknown route): just the couple, no links to any invitation. */
    :root { --maroon: #5c0f1f; --deep: #3a0812; --gold: #c9a24a; --gold-light: #ecd08a; --cream: #fbf3e4; }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body {
      margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px 16px;
      background: radial-gradient(ellipse at 50% 35%, rgba(201,162,74,.22), transparent 60%), linear-gradient(180deg, var(--deep), var(--maroon) 60%, #6e1426);
      color: var(--cream); text-align: center; font-family: "Cormorant Garamond", serif;
    }
    .arch {
      width: min(100%, 420px); padding: 72px 28px 56px; border-radius: 210px 210px 20px 20px;
      border: 1.5px solid rgba(236,208,138,.6); outline: 1px solid rgba(236,208,138,.25); outline-offset: 10px;
    }
    .om { font-family: "Tiro Devanagari Hindi", serif; color: var(--gold-light); font-size: 1.05rem; margin: 0 0 1.2rem; }
    h1 { font-family: "Great Vibes", cursive; font-weight: 400; color: var(--gold-light); font-size: clamp(2.8rem, 13vw, 4rem); line-height: 1.15; margin: 0; }
    h1 span { display: block; }
    h1 .amp { font-size: .55em; color: var(--gold); }
    .rule { width: 90px; height: 1px; background: var(--gold); margin: 1.6rem auto; }
    .date { font-family: "Marcellus", serif; letter-spacing: .16em; text-transform: uppercase; font-size: .9rem; margin: 0; }
    .place { font-style: italic; opacity: .85; margin: .4rem 0 0; font-size: 1.05rem; }
  </style>
</head>
<body>
  <main class="arch">
    <p class="om">॥ श्री शुभ विवाह ॥</p>
    <h1><span>Srishti</span><span class="amp">&amp;</span><span>Shubham</span></h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="date">January 2027</p>
    <p class="place">Bengaluru</p>
  </main>
</body>
</html>
